# Nginx Configuration for TEST (test.domicares.life)

# Upstream servers
upstream supabase_test_api {
    server localhost:8100;
}

upstream supabase_test_studio {
    server localhost:8106;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name test.domicares.life;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Frontend (Test)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.domicares.life;

    # SSL certificates (will be generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/test.domicares.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.domicares.life/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/test.domicares.life/chain.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Robots-Tag "noindex, nofollow" always; # Prevent indexing of test environment

    # Frontend files
    root /var/www/test;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to Supabase API
    location /api/ {
        proxy_pass http://supabase_test_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' 'https://test.domicares.life' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Client-Info, apikey' always;
        
        # Preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket support for Realtime
    location /api/realtime/v1 {
        proxy_pass http://supabase_test_api/realtime/v1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK - Test\n";
        add_header Content-Type text/plain;
    }

    # Rate limiting (more permissive for testing)
    limit_req_zone $binary_remote_addr zone=api_limit_test:10m rate=20r/s;
    limit_req zone=api_limit_test burst=40 nodelay;

    # Logs
    access_log /var/log/nginx/test_access.log;
    error_log /var/log/nginx/test_error.log;
}

# Studio (Admin Dashboard) - Test
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio-test.domicares.life;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/test.domicares.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.domicares.life/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://supabase_test_studio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logs
    access_log /var/log/nginx/studio_test_access.log;
    error_log /var/log/nginx/studio_test_error.log;
}
