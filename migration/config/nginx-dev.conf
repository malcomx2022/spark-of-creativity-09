# Nginx Configuration for DEV (dev.domicares.life)

# Upstream servers
upstream supabase_dev_api {
    server localhost:8200;
}

upstream supabase_dev_studio {
    server localhost:8206;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name dev.domicares.life;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Frontend (Dev)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.domicares.life;

    # SSL certificates (will be generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/dev.domicares.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.domicares.life/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dev.domicares.life/chain.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (more relaxed for dev)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always; # Prevent indexing of dev environment

    # Frontend files
    root /var/www/dev;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # No caching for dev (always get fresh files)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Proxy to Supabase API
    location /api/ {
        proxy_pass http://supabase_dev_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers (very permissive for dev)
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Client-Info, apikey' always;
        
        # Preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket support for Realtime
    location /api/realtime/v1 {
        proxy_pass http://supabase_dev_api/realtime/v1;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK - Dev\n";
        add_header Content-Type text/plain;
    }

    # No rate limiting for dev
    
    # Logs
    access_log /var/log/nginx/dev_access.log;
    error_log /var/log/nginx/dev_error.log;
}

# Studio (Admin Dashboard) - Dev
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio-dev.domicares.life;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/dev.domicares.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.domicares.life/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://supabase_dev_studio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logs
    access_log /var/log/nginx/studio_dev_access.log;
    error_log /var/log/nginx/studio_dev_error.log;
}
