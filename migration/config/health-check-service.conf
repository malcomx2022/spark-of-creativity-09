# ==============================================
# Configuration pour le service Health Check
# ==============================================
# Ce fichier configure les paramètres du monitoring automatique

# Webhook Slack pour les alertes (optionnel)
# Créer un webhook sur https://api.slack.com/messaging/webhooks
SLACK_WEBHOOK_URL=""

# Seuils d'alerte (en jours, millisecondes, pourcentage)
SSL_EXPIRY_WARNING_DAYS=30
RESPONSE_TIME_WARNING_MS=2000
DISK_USAGE_WARNING_PERCENT=80
MEMORY_USAGE_WARNING_PERCENT=85

# Notification email (optionnel - nécessite mailutils)
ALERT_EMAIL=""

# Paramètres de monitoring
HEALTH_CHECK_INTERVAL_MINUTES=5
HEALTH_CHECK_LOG_RETENTION_DAYS=30

# Environnements à vérifier (all, prod, test, dev)
HEALTH_CHECK_ENVIRONMENTS="all"

# Options d'exécution
HEALTH_CHECK_SEND_ALERTS=false
HEALTH_CHECK_JSON_OUTPUT=false
