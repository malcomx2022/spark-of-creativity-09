# =============================================================================
# Domicares — stack VPS PostgreSQL natif (production mono-nœud)
#   caddy     : reverse proxy + TLS Let's Encrypt automatique
#   web       : front Vite/React buildé, servi par nginx
#   api       : back-end (NestJS) — remplace les 46 Edge Functions Supabase
#   worker    : tâches planifiées + relais LISTEN/NOTIFY → WebSocket
#   postgres  : PostgreSQL 16 (schéma db/native)
#   redis     : files BullMQ, cache OTP/rate-limit, adapter Socket.IO
#   minio     : stockage S3 compatible (ou utiliser Wasabi : supprimer ce service)
# Variables : voir .env.example
# =============================================================================
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on: [web, api]

  web:
    build:
      context: ../..
      dockerfile: deploy/vps/web.Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}/api
        VITE_WS_URL: wss://${DOMAIN}
        VITE_MAPBOX_TOKEN: ${MAPBOX_TOKEN}
        VITE_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    expose: ["80"]

  api:
    build:
      context: ../../api        # dépôt/dossier du back-end NestJS (à créer — voir docs/migration-postgresql/03)
    restart: unless-stopped
    expose: ["3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://domicares_app:${DOMICARES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build:
      context: ../../api
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://domicares_app:${DOMICARES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - max_connections=100
      - -c
      - wal_level=replica
      - -c
      - log_min_duration_statement=500
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../db/native/010_roles.sql:/docker-entrypoint-initdb.d/10_roles.sql:ro
      - ../../db/native/schema.native.sql:/docker-entrypoint-initdb.d/20_schema.sql:ro
      - ../../db/native/120_drop_rls_optional.sql:/docker-entrypoint-initdb.d/25_drop_rls.sql:ro
      - ../../db/native/020_grants.sql:/docker-entrypoint-initdb.d/30_grants.sql:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Ne PAS exposer 5432 publiquement. Pour un accès admin : ssh -L 5432:localhost:5432
    ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis_data:/data]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [minio_data:/data]
    expose: ["9000", "9001"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
