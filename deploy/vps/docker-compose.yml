# =============================================================================
# Domicares — stack VPS PostgreSQL natif (production mono-nœud)
#   caddy     : reverse proxy + TLS Let's Encrypt automatique
#   web       : front Vite/React buildé, servi par nginx
#   api       : back-end (NestJS) — remplace les 46 Edge Functions Supabase + Socket.IO
#                (relais LISTEN/NOTIFY → WebSocket, à la place de Supabase Realtime)
#   worker    : tâches planifiées (jobs) — REALTIME_ENABLED forcé à false
#   (Redis n'est pas nécessaire sur un nœud unique : à ajouter comme adaptateur Socket.IO
#    seulement si l'API est déployée en plusieurs réplicas)
#   postgres  : PostgreSQL 16 (schéma db/native)
#   minio     : stockage S3 compatible (ou utiliser Wasabi : supprimer ce service)
# Variables : voir .env.example
# Recette sur le même VPS : second clone + docker-compose.recette.yml (document 16, §2.6) ;
# le Caddy de production la sert via le réseau domicares-edge et caddy/sites/*.caddy.
# =============================================================================
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      # Un répertoire, pas le fichier seul : docker attache l'inode d'un montage de fichier,
      # or « git pull » remplace le Caddyfile au lieu de l'écrire en place. Le conteneur
      # restait alors sur l'ancienne version, et « caddy reload » rechargeait fidèlement
      # l'ancien contenu. Un montage de répertoire se résout par chemin à chaque lecture.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN:-www.localhost}
      ACME_EMAIL: ${ACME_EMAIL}
    # edge : réseau partagé avec une recette installée sur le même VPS (recette-api, recette-web).
    networks: [default, edge]
    depends_on: [web, api]

  web:
    build:
      context: ../..
      dockerfile: deploy/vps/web.Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}/api
        VITE_WS_URL: wss://${DOMAIN}
        VITE_MAPBOX_TOKEN: ${MAPBOX_TOKEN}
        VITE_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    expose: ["80"]
    # Alias unique : sur edge, une recette expose aussi un service « web » ; Caddy vise domicares-web.
    networks:
      default:
        aliases: [domicares-web]

  api:
    build:
      context: ../../api        # back-end NestJS : même image pour l'API et le worker
    restart: unless-stopped
    expose: ["3000"]
    networks:
      default:
        aliases: [domicares-api]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://domicares_app:${DOMICARES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build:
      context: ../../api
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://domicares_app:${DOMICARES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    # postgres:16-alpine + locales musl (postgres.Dockerfile) : collations système importées à l'initdb.
    image: domicares-postgres:16-alpine-locales
    build:
      context: .
      dockerfile: postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Méthodes d'authentification d'initdb rendues explicites (ce sont ses défauts : pg_hba.conf
      # identique) ; sans elles, initdb journalise « enabling trust authentication… ». Base neuve seulement.
      POSTGRES_INITDB_ARGS: --auth-local=trust --auth-host=trust
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - max_connections=100
      - -c
      - wal_level=replica
      - -c
      - log_min_duration_statement=500
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../db/native/010_roles.sql:/docker-entrypoint-initdb.d/10_roles.sql:ro
      - ../../db/native/schema.native.sql:/docker-entrypoint-initdb.d/20_schema.sql:ro
      - ../../db/native/120_drop_rls_optional.sql:/docker-entrypoint-initdb.d/25_drop_rls.sql:ro
      - ../../db/native/130_fixes_heritage.sql:/docker-entrypoint-initdb.d/27_fixes.sql:ro
      - ../../db/native/140_academy.sql:/docker-entrypoint-initdb.d/28_academy.sql:ro
      - ../../db/native/020_grants.sql:/docker-entrypoint-initdb.d/30_grants.sql:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Ne PAS exposer 5432 publiquement. Pour un accès admin : ssh -L 5432:localhost:5432
    ports: ["127.0.0.1:5432:5432"]

  minio:
    # MinIO ne publie plus d'images ni de binaires accessibles anonymement (quay.io et Docker
    # Hub refusent le pull) : l'image est construite depuis le commit de la release épinglée
    # (minio.Dockerfile), même version qu'avant, volume minio_data repris tel quel.
    # Version épinglée : un tag mouvant casserait un jour la reprise des fichiers sans prévenir.
    image: domicares-minio:RELEASE.2025-09-07T16-13-09Z
    build:
      context: .
      dockerfile: minio.Dockerfile
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [minio_data:/data]
    expose: ["9000", "9001"]

  backup:
    # PostgreSQL + objets des trois buckets, manifeste et empreintes, copie hors site chiffrée
    # optionnelle (backup.sh). Vérification : restore-check.sh ; exercice isolé : restore-drill.sh.
    image: domicares-backup:pg16-mc-RELEASE.2025-08-13T08-35-41Z
    build:
      context: .
      dockerfile: minio.Dockerfile
      target: backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-documents}
      S3_BUCKET_AVATARS: ${S3_BUCKET_AVATARS:-avatars}
      S3_BUCKET_ATTACHMENTS: ${S3_BUCKET_ATTACHMENTS:-message-attachments}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      BACKUP_OFFSITE_KEEP_DAYS: ${BACKUP_OFFSITE_KEEP_DAYS:-30}
      BACKUP_ALERT_URL: ${BACKUP_ALERT_URL:-}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
      - ./restore-check.sh:/restore-check.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh || true; sleep \"$${BACKUP_INTERVAL_SECONDS:-86400}\"; done"]
    # « unhealthy » si aucune sauvegarde réussie depuis l'intervalle + 2 h (docker compose ps, preflight.sh).
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/last-success && test $$(( $$(date +%s) - $$(cat /backups/last-success) )) -lt $$(( $${BACKUP_INTERVAL_SECONDS:-86400} + 7200 ))"]
      interval: 30m
      timeout: 10s
      start_period: 2h
    # Pas de dépendance à minio : le service peut être retiré au profit de Wasabi ; backup.sh attend le S3.
    depends_on:
      postgres: { condition: service_healthy }

networks:
  default:
  # Nom fixe, créé par la pile de production ; la recette s'y rattache (external dans son override).
  edge:
    name: domicares-edge

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:
