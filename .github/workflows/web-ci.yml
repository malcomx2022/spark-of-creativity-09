name: Web CI

on:
  pull_request:
    paths: ['api/**', 'src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', 'postcss.config.js', 'tsconfig*.json', 'tailwind.config.ts', 'eslint.config.js', 'playwright.config.ts', 'tests/browser/**', '.github/workflows/web-ci.yml']
  push:
    branches: [main]
    paths: ['api/**', 'src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', 'postcss.config.js', 'tsconfig*.json', 'tailwind.config.ts', 'eslint.config.js', 'playwright.config.ts', 'tests/browser/**', '.github/workflows/web-ci.yml']

jobs:
  build:
    name: Typecheck, tests, build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dépendances (avis élevés et critiques bloquants)
        run: npm audit --audit-level=high
      - name: "Lint bloquant (code actif, archives exclues)"
        run: npm run lint
      - name: Lint bloquant du socle API et de ses tests
        run: npx eslint src/lib/api src/components/PwaStatus.tsx src/lib/__tests__/pwa-worker.test.ts --max-warnings=0
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
      - name: Navigateurs de test (WebKit et Chromium)
        run: npx playwright install --with-deps webkit chromium
      - name: Compatibilité Safari simulée et PWA
        run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
