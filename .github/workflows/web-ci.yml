name: Web CI

on:
  pull_request:
    paths: ['src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig*.json', 'tailwind.config.ts', '.github/workflows/web-ci.yml']
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig*.json', 'tailwind.config.ts', '.github/workflows/web-ci.yml']

jobs:
  build:
    name: Typecheck, tests, build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: "Lint (informatif, erreurs any héritées des écrans d'origine)"
        run: npm run lint
        continue-on-error: true
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api
