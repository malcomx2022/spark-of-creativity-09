name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Run tests
        run: npm test || true

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e

            echo "🚀 Starting deployment..."

            # Variables
            APP_DIR="/home/domicares/domicares"
            BACKUP_DIR="/home/domicares/backups"
            DATE=$(date +%Y%m%d_%H%M%S)

            cd $APP_DIR

            # Backup current version
            echo "💾 Creating backup..."
            tar -czf $BACKUP_DIR/pre-deploy_$DATE.tar.gz dist/ 2>/dev/null || true

            # Pull latest changes
            echo "📥 Pulling changes..."
            git fetch origin
            git reset --hard origin/main

            # Install dependencies and build
            echo "📦 Installing dependencies..."
            npm ci --production=false

            echo "🔨 Building..."
            npm run build

            # Verify build
            if [ ! -d "dist" ]; then
              echo "❌ Build failed!"
              exit 1
            fi

            # Reload nginx
            echo "🔄 Reloading Nginx..."
            sudo systemctl reload nginx

            # Cleanup old backups (keep 5)
            ls -t $BACKUP_DIR/pre-deploy_*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm

            echo "✅ Deployment successful!"

      - name: Verify deployment
        run: |
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DOMAIN_NAME }} || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Site is up and running (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Warning: Site returned HTTP $HTTP_CODE"
          fi

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment to production completed successfully!"
          echo "🌐 Site: https://${{ secrets.DOMAIN_NAME }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs for details."
