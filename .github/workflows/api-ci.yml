name: API CI

on:
  pull_request:
    paths: ['api/**', 'db/native/**', 'deploy/vps/postgres.Dockerfile', '.github/workflows/api-ci.yml']
  push:
    branches: [main]
    paths: ['api/**', 'db/native/**', 'deploy/vps/postgres.Dockerfile', '.github/workflows/api-ci.yml']

jobs:
  test:
    name: Typecheck, build, e2e (PostgreSQL 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      # PostgreSQL de production (postgres.Dockerfile : postgres:16-alpine + locales musl). Un service
      # GitHub ne se construit pas : conteneur lancé ici, prêt quand il répond en TCP (le serveur
      # temporaire d'initdb n'écoute que le socket local).
      - name: PostgreSQL 16 (image de production)
        working-directory: deploy/vps
        run: |
          docker build -q -f postgres.Dockerfile -t domicares-postgres:16-alpine-locales .
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=domicares \
            -e POSTGRES_INITDB_ARGS="--auth-local=trust --auth-host=trust" \
            domicares-postgres:16-alpine-locales
          for i in $(seq 1 60); do pg_isready -h localhost -p 5432 -U postgres -d domicares -q && break; sleep 1; done
          pg_isready -h localhost -p 5432 -U postgres -d domicares || { docker logs postgres; exit 1; }
      - name: Charger le schéma natif
        env:
          PGPASSWORD: postgres
        run: |
          for f in 010_roles.sql schema.native.sql 120_drop_rls_optional.sql 130_fixes_heritage.sql 020_grants.sql; do
            psql -h localhost -U postgres -d domicares -v ON_ERROR_STOP=1 -q -f ../db/native/$f
          done
          psql -h localhost -U postgres -d domicares -c "ALTER ROLE domicares_app PASSWORD 'ci'"
      - run: npm ci
      - name: Dépendances (avis élevés et critiques bloquants)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - name: Tests unitaires (sécurité et cycle de vie inclus)
        run: npm test -- --runInBand
      - run: npm run build
      # MinIO ne publie plus d'images ni de binaires accessibles anonymement (quay.io et Docker Hub
      # refusent le pull) : la release épinglée en production est compilée depuis son commit.
      - name: Cache MinIO (release de production)
        id: minio-cache
        uses: actions/cache@v5
        with:
          path: ~/.minio-bin
          key: minio-RELEASE.2025-09-07T16-13-09Z-07c3a429bfed-ldflags
      - uses: actions/setup-go@v6
        if: steps.minio-cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.24.x'
          cache: false
      - name: Compiler MinIO RELEASE.2025-09-07T16-13-09Z
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: |
          C=07c3a429bfed433e49018cb0f78a52145d4bedeb P=github.com/minio/minio/cmd
          GOBIN="$HOME/.minio-bin" CGO_ENABLED=0 go install -trimpath \
            -ldflags "-s -w -X $P.Version=2025-09-07T16:13:09Z -X $P.CopyrightYear=2025 -X $P.ReleaseTag=RELEASE.2025-09-07T16-13-09Z -X $P.CommitID=$C -X $P.ShortCommitID=${C:0:12}" \
            github.com/minio/minio@$C
          "$HOME/.minio-bin/minio" --version | grep -q RELEASE.2025-09-07T16-13-09Z
      - name: Démarrer MinIO (stockage isolé, identifiants jetables)
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=ci-minio MINIO_ROOT_PASSWORD=ci-minio-password \
            nohup "$HOME/.minio-bin/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/minio.log"; exit 1
      - name: Tests e2e
        env:
          DATABASE_URL: postgresql://domicares_app:ci@localhost:5432/domicares
          JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_ACCESS_KEY: ci-minio
          S3_TEST_SECRET_KEY: ci-minio-password
          S3_TEST_REQUIRED: '1'
        run: npm run test:e2e
      - name: Avertissements PostgreSQL
        if: always()
        run: docker logs postgres 2>&1 | grep -E "WARNING|warning:" || echo "Aucun avertissement PostgreSQL"
