name: Deploy VPS

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      confirm:
        description: "Tapez DEPLOYER pour confirmer"
        required: true
        type: string
      revision:
        description: "SHA complet à déployer (vide : commit du lancement)"
        required: false
        type: string
      cible:
        description: "Environnement à déployer"
        required: true
        type: choice
        options: [production, recette]
        default: production
      sans_recette:
        description: "Production : déployer un SHA non validé en recette (urgence, tracée dans le résumé)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # Avant la demande d'approbation de l'environnement « production » : quand la recette existe
  # (RECETTE_AUTO=true), la production n'accepte qu'un SHA déployé avec succès en recette. Chaque job
  # lié à un environnement crée un déploiement GitHub (SHA du run, statuts in_progress puis success
  # ou failure, inactive quand un déploiement plus récent le remplace) : on cherche un « success ».
  validation-recette:
    if: github.event_name == 'push' || inputs.confirm == 'DEPLOYER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_REVISION: ${{ inputs.revision || github.sha }}
      # Même expression que « environment » du job deploy ci-dessous.
      DEPLOY_TARGET: ${{ github.event_name == 'push' && (vars.RECETTE_AUTO == 'true' && 'recette' || 'production') || inputs.cible }}
      RECETTE_AUTO: ${{ vars.RECETTE_AUTO }}
      SANS_RECETTE: ${{ inputs.sans_recette }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Vérifier que le SHA a été validé en recette
        run: |
          set -eu
          if [ "$DEPLOY_TARGET" != production ] || [ "$RECETTE_AUTO" != true ]; then
            echo "Contrôle non applicable (cible $DEPLOY_TARGET, RECETTE_AUTO=${RECETTE_AUTO:-absent})"
            exit 0
          fi
          if [ "$SANS_RECETTE" = true ]; then
            echo "::warning::Production déployée sans validation en recette (dérogation sans_recette) : $DEPLOY_REVISION"
            echo "⚠️ Dérogation \`sans_recette\` : \`$DEPLOY_REVISION\` déployé en production sans validation en recette." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=recette&sha=$DEPLOY_REVISION&per_page=100" --jq '.[].id')
          for id in $ids; do
            if gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '.[].state' | grep -qx success; then
              echo "SHA $DEPLOY_REVISION déployé avec succès en recette (déploiement GitHub $id)"
              echo "✅ \`$DEPLOY_REVISION\` validé en recette (déploiement $id)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::$DEPLOY_REVISION n'a aucun déploiement réussi en recette. Le déployer d'abord en recette (cible recette), ou relancer avec sans_recette en cas d'urgence."
          exit 1

  deploy:
    needs: validation-recette
    if: github.event_name == 'push' || inputs.confirm == 'DEPLOYER'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Push sur main : la recette quand la variable de dépôt RECETTE_AUTO vaut « true » (document 16, §3),
    # sinon la production comme avant. Lancement manuel : l'environnement choisi.
    # Secrets propres à l'environnement GitHub « recette » (VPS_APP_DIR, DOMAIN_NAME, et VPS_HOST… si
    # autre VPS) ; les secrets du dépôt servent sinon. Approbation requise : réglage de l'environnement.
    environment: ${{ github.event_name == 'push' && (vars.RECETTE_AUTO == 'true' && 'recette' || 'production') || inputs.cible }}

    env:
      DEPLOY_REVISION: ${{ inputs.revision || github.sha }}
      DEPLOY_APP_DIR: ${{ secrets.VPS_APP_DIR }}

    steps:
      - name: Signaler une recette qui ne vaudra pas validation
        if: inputs.cible == 'recette' && inputs.revision != '' && inputs.revision != github.sha
        env:
          RUN_SHA: ${{ github.sha }}
          REVISION: ${{ inputs.revision }}
        run: |
          echo "::warning::Le déploiement GitHub est enregistré pour $RUN_SHA, pas pour la révision $REVISION : il ne validera pas cette révision pour la production. Lancer le workflow depuis ce commit, ou relancer la production avec sans_recette."

      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          envs: DEPLOY_REVISION,DEPLOY_APP_DIR
          script: |
            set -eu

            [ "${#DEPLOY_REVISION}" -eq 40 ] || {
              echo "SHA invalide : 40 caractères attendus"
              exit 1
            }

            case "$DEPLOY_REVISION" in
              *[!0-9a-f]*)
                echo "SHA invalide : caractères non hexadécimaux"
                exit 1
                ;;
            esac

            [ -n "$DEPLOY_APP_DIR" ] || {
              echo "Secret VPS_APP_DIR manquant"
              exit 1
            }

            cd "$DEPLOY_APP_DIR"

            test -d .git || {
              echo "Le dossier ne contient pas le dépôt Git"
              exit 1
            }

            git fetch origin main
            git merge-base --is-ancestor "$DEPLOY_REVISION" origin/main
            git reset --hard "$DEPLOY_REVISION"

            cd deploy/vps

            test -f .env || {
              echo "Fichier .env absent sur le VPS"
              exit 1
            }

            docker compose config --quiet
            # MinIO : image locale (minio.Dockerfile, compilée depuis le commit de la release épinglée).
            # Si l'image officielle de la même release est déjà présente, elle est reprise sans compilation.
            MINIO_RELEASE=RELEASE.2025-09-07T16-13-09Z
            if ! docker image inspect "domicares-minio:$MINIO_RELEASE" >/dev/null 2>&1; then
              if docker image inspect "quay.io/minio/minio:$MINIO_RELEASE" >/dev/null 2>&1; then
                docker tag "quay.io/minio/minio:$MINIO_RELEASE" "domicares-minio:$MINIO_RELEASE"
              else
                docker compose build minio
              fi
            fi
            docker compose build --pull web api worker
            # PostgreSQL : postgres:16-alpine local + locales musl, sans --pull (aucune montée de version
            # mineure implicite) ; au premier déploiement, le conteneur est recréé sur le volume pg_data existant.
            docker compose build postgres
            # Version applicative inscrite dans le manifeste des sauvegardes (backup.sh).
            echo "$DEPLOY_REVISION" > backups/.app-version 2>/dev/null || echo "version de sauvegarde non inscrite (droits de deploy/vps/backups)"
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f

      - name: Vérifier l'API
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          set -eu

          [ -n "$DOMAIN_NAME" ] || {
            echo "Secret DOMAIN_NAME manquant"
            exit 1
          }

          for i in $(seq 1 18); do
            code=000

            if response=$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://${DOMAIN_NAME}/api/health"); then
              code="$response"
            fi

            if [ "$code" = "200" ]; then
              echo "API disponible après déploiement de ${DEPLOY_REVISION}"
              exit 0
            fi

            echo "Tentative ${i}/18 : HTTP ${code}"
            sleep 10
          done

          echo "Échec du contrôle de santé de l'API"
          exit 1
