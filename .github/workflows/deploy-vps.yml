name: Deploy VPS

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      confirm:
        description: "Tapez DEPLOYER pour confirmer"
        required: true
        type: string
      revision:
        description: "SHA complet à déployer (vide : commit du lancement)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirm == 'DEPLOYER'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DEPLOY_REVISION: ${{ inputs.revision || github.sha }}
      DEPLOY_APP_DIR: ${{ secrets.VPS_APP_DIR }}

    steps:
      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          envs: DEPLOY_REVISION,DEPLOY_APP_DIR
          script: |
            set -eu

            [ "${#DEPLOY_REVISION}" -eq 40 ] || {
              echo "SHA invalide : 40 caractères attendus"
              exit 1
            }

            case "$DEPLOY_REVISION" in
              *[!0-9a-f]*)
                echo "SHA invalide : caractères non hexadécimaux"
                exit 1
                ;;
            esac

            [ -n "$DEPLOY_APP_DIR" ] || {
              echo "Secret VPS_APP_DIR manquant"
              exit 1
            }

            cd "$DEPLOY_APP_DIR"

            test -d .git || {
              echo "Le dossier ne contient pas le dépôt Git"
              exit 1
            }

            git fetch origin main
            git merge-base --is-ancestor "$DEPLOY_REVISION" origin/main
            git reset --hard "$DEPLOY_REVISION"

            cd deploy/vps

            test -f .env || {
              echo "Fichier .env absent sur le VPS"
              exit 1
            }

            docker compose config --quiet
            # MinIO : image locale (minio.Dockerfile, compilée depuis le commit de la release épinglée).
            # Si l'image officielle de la même release est déjà présente, elle est reprise sans compilation.
            MINIO_RELEASE=RELEASE.2025-09-07T16-13-09Z
            if ! docker image inspect "domicares-minio:$MINIO_RELEASE" >/dev/null 2>&1; then
              if docker image inspect "quay.io/minio/minio:$MINIO_RELEASE" >/dev/null 2>&1; then
                docker tag "quay.io/minio/minio:$MINIO_RELEASE" "domicares-minio:$MINIO_RELEASE"
              else
                docker compose build minio
              fi
            fi
            docker compose build --pull web api worker
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f

      - name: Vérifier l'API
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          set -eu

          [ -n "$DOMAIN_NAME" ] || {
            echo "Secret DOMAIN_NAME manquant"
            exit 1
          }

          for i in $(seq 1 18); do
            code=000

            if response=$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://${DOMAIN_NAME}/api/health"); then
              code="$response"
            fi

            if [ "$code" = "200" ]; then
              echo "API disponible après déploiement de ${DEPLOY_REVISION}"
              exit 0
            fi

            echo "Tentative ${i}/18 : HTTP ${code}"
            sleep 10
          done

          echo "Échec du contrôle de santé de l'API"
          exit 1
