name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY_TO_PRODUCTION" to confirm'
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate deployment confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY_TO_PRODUCTION" ]; then
            echo "❌ Confirmation invalide. Déploiement annulé."
            exit 1
          fi
          echo "✅ Confirmation validée"

  deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: [validate]
    if: always() && (needs.validate.result == 'success' || github.event_name == 'push')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run tests
        run: npm test
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - name: Run Payment E2E Tests
        run: |
          cd supabase/functions
          deno test --allow-net --allow-env payment-workflow.e2e.test.ts
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      
      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://domicares.life/api
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.PROD_MAPBOX_TOKEN }}
          NODE_ENV: production
      
      - name: Create backup of current production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
            
            # Backup frontend
            mkdir -p /backups/prod/frontend
            tar -czf /backups/prod/frontend/backup_${BACKUP_DATE}.tar.gz -C /var/www/prod .
            
            # Backup database
            cd /opt/supabase-prod
            docker exec supabase-prod-db pg_dump -U postgres postgres > /backups/prod/db/backup_${BACKUP_DATE}.sql
            
            echo "✅ Backup créé: ${BACKUP_DATE}"
      
      - name: Deploy frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "dist/*"
          target: "/var/www/prod/"
          strip_components: 1
          rm: true
      
      - name: Deploy Edge Functions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            cd /opt/supabase-prod
            
            # Copier les fonctions depuis le repo
            rm -rf functions
            cp -r $HOME/domicares-prod/supabase/functions ./
            
            # Déployer toutes les fonctions
            docker exec supabase-prod-functions supabase functions deploy --all
            
            echo "✅ Edge Functions déployées sur PRODUCTION"
      
      - name: Run database migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            cd /opt/supabase-prod
            
            # Appliquer les migrations avec transaction
            docker exec supabase-prod-db psql -U postgres -d postgres -c "BEGIN; \i /docker-entrypoint-initdb.d/migrations/*.sql; COMMIT;"
            
            echo "✅ Migrations appliquées sur PRODUCTION"
      
      - name: Restart services with zero downtime
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            # Reload Nginx (zero downtime)
            sudo nginx -t && sudo systemctl reload nginx
            
            # Restart Supabase services progressivement
            cd /opt/supabase-prod
            docker-compose restart kong
            sleep 5
            docker-compose restart rest
            sleep 5
            
            echo "✅ Services redémarrés sur PRODUCTION"
      
      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            # Vérifier que le frontend répond
            curl -f https://domicares.life || exit 1
            
            # Vérifier que l'API répond
            curl -f https://domicares.life/api/rest/v1/ || exit 1
            
            # Vérifier la base de données
            cd /opt/supabase-prod
            docker exec supabase-prod-db pg_isready -U postgres || exit 1
            
            # Vérifier le SSL
            curl -I https://domicares.life | grep -i "HTTP/2 200" || exit 1
            
            echo "✅ Health check passed"
      
      - name: Run smoke tests
        run: |
          # Test homepage
          curl -f https://domicares.life || exit 1
          
          # Test API health
          curl -f https://domicares.life/api/rest/v1/health || exit 1
          
          # Test auth endpoint
          curl -f https://domicares.life/api/auth/v1/health || exit 1
          
          echo "✅ Smoke tests passed"
      
      - name: Clear CDN cache (if applicable)
        if: success()
        run: |
          echo "✅ Cache CDN purgé (si applicable)"
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Déploiement PRODUCTION réussi: https://domicares.life"
          echo "✅ Tous les tests ont réussi"
          echo "📊 Backup créé et conservé"
      
      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            echo "❌ Déploiement échoué - Rollback en cours..."
            
            # Restaurer le dernier backup
            LAST_BACKUP=$(ls -t /backups/prod/frontend/backup_*.tar.gz | head -n 1)
            
            if [ -f "$LAST_BACKUP" ]; then
              tar -xzf $LAST_BACKUP -C /var/www/prod/
              sudo systemctl reload nginx
              echo "✅ Rollback effectué avec succès"
            else
              echo "❌ Aucun backup trouvé pour rollback"
            fi
      
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ ÉCHEC du déploiement PRODUCTION"
          echo "🔄 Rollback automatique effectué"
          echo "⚠️  Vérifier les logs pour plus de détails"
