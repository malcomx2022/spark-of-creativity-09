name: Recette post-livraison

# Document 14, §4 : déconnexion entre deux comptes, notifications par rôle (anciennes comprises),
# chat mobile sur un rendez-vous ancien, contact public. Navigateur réel sur l'API compilée et une
# base PostgreSQL jetable, sans interception (npm run test:recette).
on:
  pull_request:
    paths: ['api/**', 'src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', 'db/native/**', 'playwright.recette.config.ts', 'tests/recette/**', 'scripts/ci-playwright-install.sh', 'deploy/vps/postgres.Dockerfile', '.github/workflows/recette.yml']
  push:
    branches: [main]
    paths: ['api/**', 'src/**', 'public/**', 'index.html', 'package.json', 'package-lock.json', 'vite.config.ts', 'db/native/**', 'playwright.recette.config.ts', 'tests/recette/**', 'scripts/ci-playwright-install.sh', 'deploy/vps/postgres.Dockerfile', '.github/workflows/recette.yml']

jobs:
  recette:
    name: Recette navigateur (API et PostgreSQL 16 réels, Chromium et WebKit iPhone)
    runs-on: ubuntu-latest
    # 5 à 6 minutes d'habitude : plafond bien en deçà des 6 heures par défaut de GitHub.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      # PostgreSQL de production (postgres.Dockerfile : postgres:16-alpine + locales musl). Un service
      # GitHub ne se construit pas : conteneur lancé ici, prêt quand il répond en TCP (le serveur
      # temporaire d'initdb n'écoute que le socket local).
      - name: PostgreSQL 16 (image de production)
        working-directory: deploy/vps
        run: |
          docker build -q -f postgres.Dockerfile -t domicares-postgres:16-alpine-locales .
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=domicares \
            -e POSTGRES_INITDB_ARGS="--auth-local=trust --auth-host=trust" \
            domicares-postgres:16-alpine-locales
          for i in $(seq 1 60); do pg_isready -h localhost -p 5432 -U postgres -d domicares -q && break; sleep 1; done
          pg_isready -h localhost -p 5432 -U postgres -d domicares || { docker logs postgres; exit 1; }
      - name: Charger le schéma natif
        env:
          PGPASSWORD: postgres
        run: |
          for f in 010_roles.sql schema.native.sql 120_drop_rls_optional.sql 130_fixes_heritage.sql 020_grants.sql; do
            psql -h localhost -U postgres -d domicares -v ON_ERROR_STOP=1 -q -f db/native/$f
          done
          psql -h localhost -U postgres -d domicares -c "ALTER ROLE domicares_app PASSWORD 'ci'"
      - run: npm ci
      - run: npm ci
        working-directory: api
      - name: Navigateurs Playwright (Chromium, WebKit pour l'émulation iPhone)
        # Tentatives de 8 minutes au plus, 3 fois (miroir apt lent) ; plafond de l'étape au-dessus.
        timeout-minutes: 30
        run: bash scripts/ci-playwright-install.sh chromium webkit
      - name: Recette
        env:
          CI: 'true'
          RECETTE_DATABASE_URL: postgresql://domicares_app:ci@localhost:5432/domicares
        run: npm run test:recette
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: recette-post-livraison
          path: |
            playwright-report/recette/
            test-results/
          retention-days: 7
      - name: Avertissements PostgreSQL
        if: always()
        run: docker logs postgres 2>&1 | grep -E "WARNING|warning:" || echo "Aucun avertissement PostgreSQL"
