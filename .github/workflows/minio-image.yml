name: MinIO image

# Image MinIO de production construite depuis les sources (deploy/vps/minio.Dockerfile) :
# construction des deux cibles, démarrage du serveur, puis essais S3 réels de l'API contre lui.
on:
  pull_request:
    paths: ['deploy/vps/minio.Dockerfile', 'deploy/vps/docker-compose.yml', 'api/test/storage-s3.e2e-spec.ts', '.github/workflows/minio-image.yml']
  push:
    branches: [main]
    paths: ['deploy/vps/minio.Dockerfile', 'deploy/vps/docker-compose.yml', '.github/workflows/minio-image.yml']

jobs:
  image:
    name: Build et essais S3 de l'image MinIO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire le serveur (cible par défaut)
        working-directory: deploy/vps
        run: docker build -f minio.Dockerfile -t domicares-minio:RELEASE.2025-09-07T16-13-09Z .
      - name: Construire le client mc
        working-directory: deploy/vps
        run: |
          docker build -f minio.Dockerfile --target mc -t domicares-minio-mc:RELEASE.2025-08-13T08-35-41Z .
      - name: Démarrer le serveur comme dans docker-compose.yml
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-password \
            domicares-minio:RELEASE.2025-09-07T16-13-09Z server /data --console-address ":9001"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && exit 0; sleep 1; done
          docker logs minio; exit 1
      - name: Vérifier les versions (build officiel, pas DEVELOPMENT)
        run: |
          docker exec minio minio --version | tee /dev/stderr | grep -q 'RELEASE.2025-09-07T16-13-09Z (commit-id=07c3a429bfed433e49018cb0f78a52145d4bedeb)'
          docker run --rm domicares-minio-mc:RELEASE.2025-08-13T08-35-41Z --version | tee /dev/stderr | grep -q 'RELEASE.2025-08-13T08-35-41Z'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - name: Essais S3 réels contre l'image
        working-directory: api
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_ACCESS_KEY: ci-minio
          S3_TEST_SECRET_KEY: ci-minio-password
          S3_TEST_REQUIRED: '1'
        run: npx jest --config jest.e2e.config.cjs --runInBand test/storage-s3.e2e-spec.ts
